---
name: "Run Brasa locally with shell"
command: "BRASA_SHELL_PATH={{shell}} cargo run"
description: "Runs brasa with the particular shell so devs don't need to change their login shell to test a different shell locally"
arguments:
  - name: shell
    description: path of shell to use
author: Brasa Team
shells: []
